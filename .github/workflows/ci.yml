name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev libpng-dev clang libclang-dev

      # The cache key must track the mgba submodule commit: libmgba is built
      # from it, and a pin bump (e.g. a new observation patch) doesn't touch
      # .gitmodules. Record its SHA so a bump busts the cache and rebuilds.
      - name: Record toolchain inputs
        run: git -C tools/mgba rev-parse HEAD > .mgba-sha

      # setup-toolchain is idempotent: a cache hit makes it a no-op.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            tools/binutils
            tools/agbcc
            tools/agbcc-src
            tools/libmgba
          key: toolchain-${{ runner.os }}-${{ hashFiles('Makefile', '.gitmodules', '.mgba-sha') }}-v2

      - name: Build toolchain (agbasm binutils, gbagfx, libmgba)
        run: make setup-toolchain

      - name: Build compressed assets
        run: make assets -j"$(nproc)"

      - name: Build ROM and verify SHA1
        run: make all -j"$(nproc)"

      - name: Generate function map (profiler index)
        run: make funcmap

      # BIOS-dependent harness tests skip themselves when no BIOS is
      # present and CI=true (GitHub sets CI). Locally they are mandatory.
      - name: Harness tests
        working-directory: tools/harness
        run: cargo test --verbose
